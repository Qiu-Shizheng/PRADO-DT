[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prado-dt"
version = "0.2.1"
description = "ContextDose: source-selected reliability models for cellular response transfer"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Qiu-Shizheng"}]
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
core = ["numpy>=1.23"]
data = ["anndata>=0.9", "h5py>=3.8", "numpy>=1.23"]
torch = ["torch>=2.0"]
all = ["numpy>=1.23", "anndata>=0.9", "h5py>=3.8", "torch>=2.0"]
dev = ["pytest>=7"]

[project.scripts]
prado-dt-smoke = "prado_dt.cli:main"
contextdose-predict = "prado_dt.transfer:main"
contextdose-fit = "prado_dt.transfer_fit:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
